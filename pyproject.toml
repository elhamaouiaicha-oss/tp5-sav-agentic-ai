[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sav-agentic-ai"
version = "0.1.0"
description = "TP5 — SAV d'un distributeur : IA agentique avec LangChain, LangGraph, MCP et RAG multimodal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "langchain-mcp-adapters>=0.2",
    "mcp>=1.27",
    "chromadb>=1.0",
    "pymupdf>=1.24.3",
    "pillow>=10",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Plongements CLIP multilingues (texte FR + images) — nécessaires pour EMBEDDINGS_BACKEND=clip
clip = ["sentence-transformers>=3.0"]
# LLM local via Ollama
ollama = ["langchain-ollama>=1.0"]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
sav = "sav.main:main"
sav-mcp = "sav.mcp_server:main"
sav-ingest = "sav.rag.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
